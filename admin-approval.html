<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Account Approval - Finance Software</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body {
            margin: 0;
            padding: 0;
        }

        .approval-container {
            width: 95%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .approval-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .approval-header h1 {
            margin-bottom: 8px;
        }

        .approval-header p {
            color: #666;
        }

        .request-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
        }

        .request-card h3 {
            margin-top: 0;
            color: #333;
        }

        .request-details {
            line-height: 1.8;
            margin-bottom: 15px;
        }

        .request-details strong {
            display: inline-block;
            min-width: 100px;
        }

        .status {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            background: #fff3cd;
            color: #856404;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .approve-btn,
        .reject-btn,
        .back-btn {
            border: none;
            padding: 11px 20px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
        }

        .approve-btn {
            background: #198754;
            color: white;
        }

        .approve-btn:hover {
            background: #157347;
        }

        .reject-btn {
            background: #dc3545;
            color: white;
        }

        .reject-btn:hover {
            background: #bb2d3b;
        }

        .back-btn {
            background: #6c757d;
            color: white;
        }

        .back-btn:hover {
            background: #5c636a;
        }

        .empty-message {
            text-align: center;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 10px;
            color: #666;
        }

        .loading {
            text-align: center;
            padding: 30px;
        }

        @media (max-width: 600px) {

            .approval-container {
                width: 92%;
                margin: 20px auto;
            }

            .request-card {
                padding: 15px;
            }

            .action-buttons {
                flex-direction: column;
            }

            .approve-btn,
            .reject-btn {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<div class="approval-container">


    <div class="approval-header">

        <h1>Account Approval</h1>

        <p>
            Review and approve new account requests
        </p>

    </div>


    <div id="requestsContainer">

        <div class="loading">
            Loading account requests...
        </div>

    </div>


    <br>


    <button
        type="button"
        class="back-btn"
        id="backButton"
    >
        ← Back
    </button>


</div>


<script
    type="module"
    src="admin-approval.js">
</script>


</body>

</html>
