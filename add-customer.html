<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>కస్టమర్‌ను జోడించండి</title>

<style>
    .form-box{

    width:95%;
    max-width:500px;
    margin:30px auto;
    background:#fff;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);

}

.form-box label{

    display:block;
    margin-top:12px;
    margin-bottom:5px;
    font-weight:bold;

}

.form-box input{

    width:100%;
    box-sizing:border-box;
    padding:14px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;

}
.save-btn{

    width:100%;
    padding:15px;
    background:#4CAF50;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;

}

.location-btn{

    width:100%;

    padding:14px;

    margin-top:10px;

    margin-bottom:15px;

    border:none;

    border-radius:8px;

    background:#ff9800;

    color:white;

    font-size:17px;

    cursor:pointer;

}

.location-btn:hover{

    background:#f57c00;

}
.voice-input{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:15px;
}

.voice-input input{
    flex:1;
    margin-bottom:0;
}

.voice-input button{
    width:55px;
    height:48px;
    border:none;
    border-radius:8px;
    background:#2196F3;
    color:white;
    font-size:22px;
    cursor:pointer;
}

.voice-input button:hover{
    background:#1976D2;
}

@media screen and (max-width:768px){

    body{

        margin:0;
        padding:10px;
        background:#f5f5f5;

    }

    .form-box{

        width:100%;
        max-width:100%;
        margin:10px auto;
        padding:15px;
        box-sizing:border-box;

    }

    h2{

        font-size:22px;
        text-align:center;

    }

    .back-btn{

        width:100%;
        margin-bottom:15px;

    }

    .save-btn,
    .location-btn{

        width:100%;
        font-size:17px;

    }

}
</style>

</head>

<body>

<div class="top-bar">

    <button class="back-btn" onclick="history.back()">
        ⬅ Back
    </button>

    <h2>కస్టమర్‌ను జోడించండి</h2>

</div>

<!-- Form Start -->

<div class="form-box">

    <label>సీరియల్ నంబర్</label>

    <input type="number"
           id="serialNo"
              placeholder="సీరియల్ నంబర్">
        

    <label>కస్టమర్ పేరు</label>

<div class="voice-input">
    <input type="text"
           id="customerName"
           placeholder="కస్టమర్ పేరు">

    <button type="button"
            onclick="startVoice('customerName')">
        🎤
    </button>
</div>


<label>W/o, S/o, D/o</label>
<div class="voice-input">
    <input type="text"
           id="relation"
           placeholder="W/o, S/o లేదా D/o">

    <button type="button"
            onclick="startVoice('relation')">
        🎤
    </button>
</div>


<label>గ్రామం</label>

<div class="voice-input">
    <input type="text"
           id="village"
           placeholder="గ్రామం">

    <button type="button"
            onclick="startVoice('village')">
        🎤
    </button>
</div>
    

    <label>ఫోన్ నంబర్</label>

    <input type="tel"
           id="phone"
           maxlength="10"
           placeholder="ఫోన్ నంబర్">

    <label>ఆధార్ నంబర్</label>

    <input type="text"
           id="aadhar"
           maxlength="12"
           placeholder="ఆధార్ నంబర్">

    <label>కస్టమర్ ఫోటో</label>

<input
    type="file"
    id="customerPhoto"
    accept="image/*">

<label>ప్రస్తుత లొకేషన్</label>

<input
    type="text"
    id="location"
    placeholder="లొకేషన్ పొందడానికి క్లిక్ చేయండి"
    >

<button
    type="button"
    class="location-btn"
    onclick="getLocation()">

    📍 Get Live Location

</button><br><br>


    <button class="save-btn"
            onclick="saveCustomer()">

        కస్టమర్‌ను సేవ్ చేయండి

    </button>

</div>

<script type="module" src="customer.js"></script>

</body>

</html>
