<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - Finance Software</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>ఖాతాను సృష్టించండి</h1>

    <p>కొత్త ఖాతా కోసం అభ్యర్థన</p>

    <form id="createAccountForm">

        <!-- Name -->
        <input
            type="text"
            id="name"
            placeholder="పూర్తి పేరు"
            required
        >

        <!-- Mobile Number -->
        <input
            type="tel"
            id="mobile"
            placeholder="మొబైల్ నంబర్"
            maxlength="10"
            required
        >

        <!-- Username -->
        <input
            type="text"
            id="username"
            placeholder="యూజర్ పేరు"
            required
        >

        <!-- Password -->
        <input
            type="password"
            id="password"
            placeholder="పాస్‌వర్డ్"
            required
        >

        <!-- Confirm Password -->
        <input
            type="password"
            id="confirmPassword"
            placeholder="పాస్‌వర్డ్‌ను నిర్ధారించండి"
            required
        >

        <button
            type="submit"
            class="create-account-btn"
        >
            ఖాతాను సృష్టించండి
        </button>

    </form>

    <br>

    <button
        onclick="goBack()"
        class="back-btn"
    >
        ← Back
    </button>

</div>

<script
    type="module"
    src="create-account.js">
</script>

</body>

</html>
