<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ఓనర్ రోజువారీ షీట్</title>

<style>

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#f5f7fb;
}

.container{
    max-width:700px;
    margin:auto;
    background:#fff;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
}

h2{
    text-align:center;
    color:#1565c0;
    margin-bottom:25px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:5px;
    font-weight:bold;
    color:#444;
}

input,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    box-sizing:border-box;
}

input[readonly]{
    background:#f2f2f2;
}

textarea{
    resize:none;
    height:80px;
}

.summary-box{
    display:flex;
    justify-content:space-between;
    gap:15px;
    margin:20px 0;
}

.card{
    flex:1;
    background:#1565c0;
    color:#fff;
    padding:15px;
    border-radius:10px;
    text-align:center;
}

.card h4{
    margin:0;
    font-size:15px;
}

.card h3{
    margin-top:10px;
    font-size:24px;
}

button{
    width:100%;
    margin-top:25px;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#28a745;
    color:#fff;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#218838;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

table th{
    background:#1565c0;
    color:#fff;
    padding:12px;
}

table td{
    padding:10px;
    text-align:center;
    border-bottom:1px solid #ddd;
}

tfoot th{
    background:#28a745;
    color:#fff;
}

@media(max-width:600px){

    .summary-box{
        flex-direction:column;
    }

    .container{
        padding:15px;
    }

    h2{
        font-size:22px;
    }

    button{
        font-size:16px;
    }

}

</style>

</head>

<body>

<div class="container">

<h2>📒 Daily Sheet</h2>

<label>తేదీ</label>

<input
type="date"
id="todayDate"
readonly>

<br><br>

<label>ఓనర్ పేరు</label>

<input 
type="text" 
id="ownerName" 
readonly>

<br><br>

<label>ప్రారంభ నగదు</label>

<input
type="number"
id="openingCash"
placeholder="ప్రారంభ నగదు నమోదు చేయండి">

<br><br>

<div class="summary-box">

    <div class="card">

        <h4>ఈరోజు రుణం</h4>

        <h3 id="totalLoan">₹0</h3>

    </div>

    <div class="card">

        <h4>ఈరోజు వసూళ్లు</h4>

        <h3 id="totalCollection">₹0</h3>

    </div>

</div>

<label>ఖర్చులు</label>

<input
type="number"
id="expenses"
placeholder="ఖర్చులు నమోదు చేయండి">

<br><br>

<label>ముగింపు నగదు</label>

<h3 id="closingCash">
₹0
</h3>

<label>గమనికలు</label>

<textarea
id="notes"
placeholder="గమనికలు నమోదు చేయండి">
</textarea>

<br><br>

<button
onclick="saveDailySheet()">

💾 Save Daily Sheet

</button>

</div>

<script
type="module"
src="staff-daily-sheet.js">
</script>

</body>

</html>
